server {
    listen 0.0.0.0:8080;
    server_name example.com;
    root /var/www;

    location / {
        methods GET POST DELETE;
    }

    location /images {
        methods GET;
        root /var/www/images;
    }
}

server {
    listen 127.0.0.1:9090;
    root /var/www/api;

    location /upload {
        methods POST;
    }
}