server {
    listen 0.0.0.0:8080;
    server_name example.com;
    root /var/www;

    client_max_body_size 1000000;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET;
        index index.html;
        autoindex off;
    }

    location /images {
        methods GET;
        root /srv/images;
        autoindex on;
    }

    location /upload {
        methods POST DELETE;
        upload_dir /var/www/uploads;
    }

    location /old {
        methods GET;
        redirect 301 /new;
    }

    location /cgi-bin {
        methods GET POST;
        root /var/www/cgi-bin;
        cgi_handler .py /usr/bin/python3;
    }
}