server {
    listen 0.0.0.0:8080;
    server_name toto.com;
    root /var/www/toto;

    location / {
        methods GET;
    }

    location /images {
        methods GET;
    }
}

server {
    listen 0.0.0.0:8080;
    server_name tata.com;
    root /var/www/tata;

    location /api {
        methods GET POST;
    }

    location /api/admin {
        methods GET;
    }
}