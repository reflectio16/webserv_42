server {
    listen 0.0.0.0:8080;
    root /var/www;

    location / {
        methods GET;
        index index.html;
		autoindex off;
    }

    location /images {
        methods GET;
        root /srv/images;
        index gallery.html;
		autoindex on;
    }

    location /upload {
        methods POST DELETE;
    }
}