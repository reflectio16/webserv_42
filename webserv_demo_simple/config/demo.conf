server {
    listen 0.0.0.0:8080;
    server_name example.com;
    root /tmp/webserv-demo-simple/www;
    client_max_body_size 1024;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 501 /errors/501.html;
    error_page 504 /errors/504.html;

    location / {
        methods GET;
        root /tmp/webserv-demo-simple/www;
        index index.html;
        autoindex off;
    }

    location /images {
        methods GET;
        root /tmp/webserv-demo-simple/www/images;
        autoindex on;
    }

    location /forbidden {
        methods GET;
        root /tmp/webserv-demo-simple/forbidden;
        autoindex off;
    }

    location /old {
        methods GET;
        redirect 301 /new.html;
    }

    location /temp {
        methods GET;
        redirect 307 /maintenance.html;
    }

    location /upload {
        methods POST;
        root /tmp/webserv-demo-simple/www;
        upload_dir /tmp/webserv-demo-simple/uploads;
        autoindex off;
    }

    location /uploads {
        methods GET DELETE;
        root /tmp/webserv-demo-simple/uploads;
        autoindex on;
    }

    location /cgi {
        methods GET POST;
        root /tmp/webserv-demo-simple/cgi;
        cgi_handler .py /usr/bin/python3;
    }
}

server {
    listen 0.0.0.0:8080;
    server_name test.com;
    root /tmp/webserv-demo-simple/test;

    location / {
        methods GET;
        root /tmp/webserv-demo-simple/test;
        index index.html;
        autoindex off;
    }
}
